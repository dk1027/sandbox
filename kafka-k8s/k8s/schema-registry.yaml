apiVersion: apps/v1
kind: Deployment
metadata:
  name: confluent-sr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: confluent-sr
  template:
    metadata:
      labels:
        app: confluent-sr
    spec:
      enableServiceLinks: false
      containers:
        - name: schema-registry
          image: confluentinc/cp-schema-registry:8.2.2
          ports:
            - containerPort: 8081
          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              value: confluent-sr
            - name: SCHEMA_REGISTRY_LISTENERS
              value: http://0.0.0.0:8081
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: PLAINTEXT://my-cluster-kafka-bootstrap:9092
---
apiVersion: v1
kind: Service
metadata:
  name: confluent-sr
spec:
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: confluent-sr
