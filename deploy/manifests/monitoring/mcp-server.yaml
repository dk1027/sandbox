apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-server-cluster-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "services", "events", "namespaces", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kafka.strimzi.io"]
    resources: ["kafkas", "kafkatopics", "kafkaconsumergroups"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "prometheusrules"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["chaos.dk1027.io"]
    resources: ["chaosexperiments", "nodechaostasks"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-server-cluster-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-server-cluster-reader
subjects:
  - kind: ServiceAccount
    name: mcp-server
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      serviceAccountName: mcp-server
      containers:
        - name: mcp-server
          image: ryzen.local:5001/mcp-server:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: metrics
          env:
            - name: PROMETHEUS_URL
              value: http://prometheus-operated.monitoring.svc.cluster.local:9090
            - name: LOKI_URL
              value: http://loki-gateway.logging.svc.cluster.local:3100
            - name: KAFKA_BROKER_POD
              value: my-cluster-kafka-pool-a-0
            - name: KAFKA_NAMESPACE
              value: kafka
            - name: METRICS_PORT
              value: "8081"
            - name: OTEL_SERVICE_NAME
              value: sre-observability-mcp
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.tracing.svc.cluster.local:4317
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: monitoring
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: metrics
  selector:
    app: mcp-server
