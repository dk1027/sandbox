apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: pool-a
  labels:
    strimzi.io/cluster: my-cluster
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 5Gi
        deleteClaim: true
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: my-cluster
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.2.0
    metricsConfig:
      type: jmxPrometheusExporter
      values:
        jmxPort: 9999
        rules:
          - "kafka.server:type=ReplicaManager"
          - "kafka.server:type=ReplicaFetcherManager,attr=MaxLag"
          - "kafka.server:type=BrokerTopicMetrics"
          - "kafka.server:type=IsrManager"
          - "kafka.server:type=SessionManager"
          - "kafka.server:type=RequestMetrics"
          - "kafka.server:type=GroupCoordinator,groupId=*"
          - "kafka.server:type=ConsumerCoordinator,groupId=*"
          - "kafka.server:type=TransactionCoordinator"
          - "kafka.server:type=DelayedOperationPurgatory,DelayedOperation=*"
          - "kafka.server:type=FetcherManager,client=*"
          - "kafka.server:type=SocketServer"
          - "kafka.server:type=KafkaRequestHandlerPool"
          - "kafka.server:type=AppInfo"
          - "kafka.server:type=LogManager"
          - "kafka.server:type=QuotaManager,quotaType=*"
          - "kafka.controller:type=KafkaController"
          - "kafka.controller:type=ControllerStats"
          - "kafka.network:type=RequestMetrics"
          - "kafka.network:type=SocketServer"
          - "kafka.group:type=GroupCoordinator"
          - "kafka.coordinator.group:type=GroupCoordinator"
          - "kafka.coordinator.transaction:type=TransactionCoordinator"
          - "kafka.cluster:type=ClusterMetadataManager"
          - "kafka.metadata:type=MetadataCache"
          - "kafka.metadata:type=MetadataQuorumClientMetrics"
          - "kafka.metadata:type=MetadataQuorumMetrics"
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: test-topic
  labels:
    strimzi.io/cluster: my-cluster
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: 7200000
    segment.bytes: 1073741824
