# Grafana Loki via the grafana/loki Helm chart.
# Keep these values aligned with chart 7.x: deployment mode is top-level and
# Loki config should use structured chart values instead of overriding
# loki.config with a raw map.

deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 10Gi

read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

loki:
  auth_enabled: false
  commonConfig:
    path_prefix: /var/loki
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    max_cache_freshness_per_query: 10m
    retention_period: 72h
  analytics:
    reporting_enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false
