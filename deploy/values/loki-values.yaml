# Grafana Loki stack via grafana/loki Helm chart
# Battle-tested: https://github.com/grafana/helm-charts/tree/main/charts/loki

loki:
  deploymentMode: SingleBinary
  singleBinary:
    replicas: 1
    storage:
      type: Filesystem
      filesystem:
        directory: /var/loki
      volumeClaimTemplate:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
  config:
    auth_enabled: false
    storage:
      type: filesystem
    common:
      path_prefix: /var/loki
    ingester:
      lifecycler:
        address: 127.0.0.1
        ring:
          kvstore:
            store: inmemory
          replication_factor: 1
      chunk_block_size: 131072
      chunk_encoding: snappy
    limits_config:
      enforce_metric_name: false
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      max_cache_freshness_per_query: 10m
      retention_period: 72h
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    analytics:
      reporting_ingester_memory: false

# Promtail as DaemonSet to collect all container logs
promtail:
  enabled: true
  config:
    clients:
      - url: http://loki-gateway.logging.svc.cluster.local/loki/api/v1/push
    snippets:
      pipelineStagesBefore:
        - docker: {}
      pipelineStagesAfter: []
  extraPorts:
    - name: http-oob
      port: 80
      targetPort: 80
  networkPolicy:
    enabled: false
