prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 2d
    retentionSize: 8GiB
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

# Alertmanager keeps default config (no receivers needed for local dev)
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

grafana:
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.ryzen.local
    path: /
    tls:
      - hosts:
          - grafana.ryzen.local
  grafana.ini:
    server:
      domain: grafana.ryzen.local
      root_url: https://grafana.ryzen.local/
  persistence:
    enabled: true
    type: pvc
    accessModes:
      - ReadWriteOnce
    size: 2Gi
  # Auto-import dashboards from ConfigMaps labeled grafana_dashboard: "1"
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      kafka-cluster:
        url: https://raw.githubusercontent.com/grafana/grafana-kafka-app-dashboards/main/dashboards/kafka-overview.json
      kafka-consumer:
        url: https://raw.githubusercontent.com/grafana/grafana-kafka-app-dashboards/main/dashboards/kafka-consumer.json
  # Add Loki and Tempo as datasources once deployed
  additionalDataSources: |
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.logging.svc.cluster.local:3100
      isDefault: false
      editable: true
    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo.tracing.svc.cluster.local:3200
      editable: true
