prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 2d
    retentionSize: 8GiB
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by:
        - namespace
        - app
        - alertname
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        - receiver: producer-sre-agent
          matchers:
            - namespace = "apps"
            - app = "producer"
        - receiver: consumer-sre-agent
          matchers:
            - namespace = "apps"
            - app = "consumer"
        - receiver: sre-agent
          matchers:
            - namespace = "apps"
    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ warning|info
        equal:
          - namespace
          - alertname
      - source_matchers:
          - severity = warning
        target_matchers:
          - severity = info
        equal:
          - namespace
          - alertname
      - source_matchers:
          - alertname = InfoInhibitor
        target_matchers:
          - severity = info
        equal:
          - namespace
      - target_matchers:
          - alertname = InfoInhibitor
    receivers:
      - name: "null"
      - name: producer-sre-agent
        webhook_configs:
          - url: http://sre-agent-producer.apps.svc.cluster.local:8080/alerts
            send_resolved: true
      - name: consumer-sre-agent
        webhook_configs:
          - url: http://sre-agent-consumer.apps.svc.cluster.local:8080/alerts
            send_resolved: true
      - name: sre-agent
        webhook_configs:
          - url: http://sre-agent.apps.svc.cluster.local:8080/alerts
            send_resolved: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

grafana:
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.ryzen.local
    path: /
    tls:
      - hosts:
          - grafana.ryzen.local
  grafana.ini:
    server:
      domain: grafana.ryzen.local
      root_url: https://grafana.ryzen.local/
  persistence:
    enabled: true
    type: pvc
    accessModes:
      - ReadWriteOnce
    size: 2Gi
  # Auto-import dashboards from ConfigMaps labeled grafana_dashboard: "1"
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  # Add Loki and Tempo as datasources once deployed
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.logging.svc.cluster.local:3100
      isDefault: false
      editable: true
    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo.tracing.svc.cluster.local:3200
      editable: true
