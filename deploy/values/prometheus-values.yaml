prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    retention: 2d
    retentionSize: 8GiB
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

grafana:
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.ryzen.local
    path: /
    tls:
      - hosts:
          - grafana.ryzen.local
  grafana.ini:
    server:
      domain: grafana.ryzen.local
      root_url: https://grafana.ryzen.local/
  persistence:
    enabled: true
    type: pvc
    accessModes:
      - ReadWriteOnce
    size: 2Gi
