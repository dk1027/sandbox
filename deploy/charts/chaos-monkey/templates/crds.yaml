apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: chaosexperiments.chaos.dk1027.io
spec:
  group: chaos.dk1027.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - targetSelectors
                - action
                - duration
              properties:
                targetSelectors:
                  type: object
                  required:
                    - podSelector
                  properties:
                    namespaces:
                      type: array
                      items:
                        type: string
                    podSelector:
                      type: object
                      properties:
                        matchExpressions:
                          type: array
                          items:
                            type: object
                            required:
                              - key
                              - operator
                            properties:
                              key:
                                type: string
                              operator:
                                type: string
                              values:
                                type: array
                                items:
                                  type: string
                        matchLabels:
                          type: object
                          additionalProperties:
                            type: string
                action:
                  type: string
                duration:
                  type: string
                parameters:
                  type: object
                  properties:
                    latencyMs:
                      type: integer
                    dropPercentage:
                      type: integer
                    corruptPercentage:
                      type: integer
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: chaosexperiments
    singular: chaosexperiment
    kind: ChaosExperiment
    shortNames:
      - chaosexp
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodechaostasks.chaos.dk1027.io
spec:
  group: chaos.dk1027.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - nodeName
                - targetSelectors
                - chaosConfig
                - endTime
              properties:
                nodeName:
                  type: string
                targetSelectors:
                  type: object
                  required:
                    - podSelector
                  properties:
                    namespaces:
                      type: array
                      items:
                        type: string
                    podSelector:
                      type: object
                      properties:
                        matchExpressions:
                          type: array
                          items:
                            type: object
                            required:
                              - key
                              - operator
                            properties:
                              key:
                                type: string
                              operator:
                                type: string
                              values:
                                type: array
                                items:
                                  type: string
                        matchLabels:
                          type: object
                          additionalProperties:
                            type: string
                chaosConfig:
                  type: object
                  required:
                    - dropPercentage
                    - latencyMs
                    - corruptPercentage
                    - deadManTimestamp
                  properties:
                    dropPercentage:
                      type: integer
                    latencyMs:
                      type: integer
                    corruptPercentage:
                      type: integer
                    deadManTimestamp:
                      type: integer
                      format: int64
                endTime:
                  type: string
                  format: date-time
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: nodechaostasks
    singular: nodechaostask
    kind: NodeChaosTask
    shortNames:
      - nodetask
