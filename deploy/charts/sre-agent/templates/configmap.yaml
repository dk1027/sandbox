apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sre-agent.fullname" . }}-config
  labels:
    {{- include "sre-agent.labels" . | nindent 4 }}
data:
  APP_NAME: {{ required "app.name is required" .Values.app.name | quote }}
  APP_NAMESPACE: {{ default .Release.Namespace .Values.app.namespace | quote }}
  LISTEN_ADDR: {{ .Values.listenAddr | quote }}
  LLM_BASE_URL: {{ .Values.llm.baseUrl | quote }}
  LLM_MODEL: {{ .Values.llm.model | quote }}
  REMEDIATION_MODE: {{ .Values.runtime.remediationMode | quote }}
  CONFIDENCE_THRESHOLD: {{ printf "%v" .Values.runtime.confidenceThreshold | quote }}
  PROMETHEUS_URL: {{ .Values.observability.prometheusUrl | quote }}
  LOKI_URL: {{ .Values.observability.lokiUrl | quote }}
  OTEL_SERVICE_NAME: {{ default (include "sre-agent.fullname" .) .Values.observability.otelServiceName | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.observability.otelExporterOtlpEndpoint | quote }}
  ALERT_ROUTING_RECEIVER: {{ default (include "sre-agent.fullname" .) .Values.alertRouting.receiver | quote }}
  ALERT_ROUTING_WEBHOOK_PATH: {{ .Values.alertRouting.webhookPath | quote }}
  ALERT_ROUTING_MATCH_LABELS: {{ .Values.alertRouting.matchLabels | toJson | quote }}
  ALERT_ROUTING_GROUP_BY: {{ .Values.alertRouting.groupBy | toJson | quote }}
