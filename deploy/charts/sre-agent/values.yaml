nameOverride: ""
fullnameOverride: ""

app:
  name: sre-agent
  namespace: apps

image:
  repository: ryzen.local:5001/sre-agent
  tag: dev
  pullPolicy: Always

replicaCount: 1
listenAddr: ":8080"

llm:
  # The sidecar proxies to the host MLX/OpenAI-compatible service. Kubernetes
  # pods do not resolve the MacBook's mDNS name by default, so the deployment
  # also injects a host alias for the dev host name.
  baseUrl: http://127.0.0.1:8081/v1
  model: gpt-4o-mini
  apiKey: "***"
  sidecar:
    enabled: true
    image: python:3.14-slim
    pullPolicy: IfNotPresent
    port: 8081
    upstreamBaseUrl: http://longs-macbook-pro.local:8080
    upstreamTimeoutSeconds: 180

podHostAliases:
  - ip: 192.168.1.77
    hostnames:
      - longs-macbook-pro.local

observability:
  prometheusUrl: http://prometheus-operated.monitoring.svc.cluster.local:9090
  lokiUrl: http://loki-gateway.logging.svc.cluster.local:3100
  otelServiceName: ""
  otelExporterOtlpEndpoint: http://tempo.tracing.svc.cluster.local:4317

alertRouting:
  receiver: ""
  webhookPath: /alerts
  matchLabels:
    app: ""
    namespace: ""
  groupBy:
    - alertname
    - namespace
    - app

runtime:
  remediationMode: recommend
  confidenceThreshold: 0.7

service:
  type: ClusterIP
  port: 8080
  annotations: {}

podAnnotations: {}
podLabels: {}
resources: {}

rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods", "services", "events", "configmaps", "persistentvolumeclaims"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["apps"]
      resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
      verbs: ["get", "list", "watch", "patch", "update"]
    - apiGroups: ["batch"]
      resources: ["jobs", "cronjobs"]
      verbs: ["get", "list", "watch"]

serviceAccount:
  create: true
  annotations: {}
  name: ""
